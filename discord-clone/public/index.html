<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cord — salon de discussion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Guild switcher -->
    <nav id="guilds" aria-label="Serveurs">
      <div class="guild active" title="Cord">C</div>
    </nav>

    <!-- Channel sidebar -->
    <aside id="sidebar">
      <header id="server-name">
        <span>Cord</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M8.1 13.34l2.83-2.83L3.91 3.5a4.008 4.008 0 000 5.66l4.19 4.18zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3.7 19.87l1.41 1.41L12 14.41l6.88 6.88 1.41-1.41L13.41 13l1.47-1.47z"/>
        </svg>
      </header>
      <div id="channel-list" aria-label="Salons"></div>
      <footer id="self-card">
        <div class="avatar" id="self-avatar"></div>
        <div class="self-meta">
          <span class="self-name" id="self-name">…</span>
          <button id="change-name" title="Changer de pseudo">✎</button>
        </div>
      </footer>
    </aside>

    <!-- Main chat area -->
    <main id="chat">
      <header id="chat-header">
        <h1 id="channel-title"># général</h1>
        <span id="channel-topic"></span>
      </header>
      <div id="messages" aria-live="polite"></div>
      <form id="composer">
        <input id="composer-input" type="text" maxlength="2000" autocomplete="off"
               placeholder="Écrire dans #général" />
        <button type="submit" id="send-btn">Envoyer</button>
      </form>
    </main>

    <!-- Member sidebar -->
    <aside id="members" aria-label="Membres"></aside>
  </div>

  <!-- Nickname dialog -->
  <div id="overlay" class="hidden">
    <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Bienvenue sur Cord 👋</h2>
      <p>Choisis un pseudo pour rejoindre le serveur.</p>
      <form id="name-form">
        <input id="name-input" type="text" maxlength="32" autocomplete="nickname"
               placeholder="Ton pseudo" required />
        <button type="submit">Rejoindre</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
