# Cord (chat, port 555) + GitLab derrière nginx — tout passe par le port 80.
# Installation : voir nginx/README.md
#
# À adapter :
#   - le port GitLab dans l'upstream `gitlab_backend` (= résultat de `docker ps`)

# Chat Node.js (port 555)
upstream cord_chat {
    server 127.0.0.1:555;
}

# GitLab Docker — exemple avec le mapping classique -p 8080:80.
# Remplacez 8080 par le port réel affiché dans `docker ps` (colonne PORTS).
upstream gitlab_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80 default_server;
    server_name _;

    # GitLab reçoit de gros push HTTP : ne pas limiter la taille des corps.
    client_max_body_size 0;

    # ---- Chat : tout le reste du trafic va vers Cord sur 555.
    # Le chemin / correspond aussi au WebSocket /ws (chat temps réel)
    # et à la signalisation WebRTC (salons vocaux).
    location / {
        proxy_pass http://cord_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Garde le WebSocket / les connexions vocales ouvertes longtemps.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ---- GitLab sous /gitlab.
    # Prérequis (une seule fois, dans gitlab.rb du conteneur GitLab) :
    #   external_url 'http://<IP-DU-SERVEUR>/gitlab'
    # puis reconfigurer GitLab (gitlab-ctl reconfigure ou recréer le conteneur).
    # GitLab gère alors lui-même relative_url_root='/gitlab'.
    location /gitlab/ {
        proxy_pass http://gitlab_backend/gitlab/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;
        proxy_read_timeout 86400;
    }
}