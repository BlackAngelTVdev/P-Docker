# Variante « un sous-domaine par service » — à n'utiliser que si un nom de
# domaine pointe (DNS A/AAAA) vers le serveur.
#   chat.votredomaine.fr   → Cord
#   gitlab.votredomaine.fr → GitLab
#
# GitLab : external_url 'http://gitlab.votredomaine.fr' dans gitlab.rb
# puis reconfigurer GitLab. Ici pas de sous-chemin : le `location /` suffit.

upstream cord_chat {
    server 127.0.0.1:555;
}

# Remplacez 8080 par le port réel affiché dans `docker ps`.
upstream gitlab_backend {
    server 127.0.0.1:8080;
}

# ---- Chat
server {
    listen 80;
    server_name chat.votredomaine.fr;

    location / {
        proxy_pass http://cord_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# ---- GitLab
server {
    listen 80;
    server_name gitlab.votredomaine.fr;

    client_max_body_size 0;

    location / {
        proxy_pass http://gitlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}