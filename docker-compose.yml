version: '3.8'

# Secrets Swarm créés pour éviter d'exposer les mots de passe de BDD en clair
secrets:
  db_password:
    external: true
  db_root_password:
    external: true

# Réseaux Overlay distincts pour séparer le flux public (frontend) du flux BDD (backend)
networks:
  frontend:
    external: true
  backend:
    external: true
  # Réseau dédié à la communication Swarmpit App <-> Agents <-> DB
  swarmpit_net:
    driver: overlay

# Volumes persistants pour conserver les données SQL et les fichiers WordPress/médias
volumes:
  wp_data:
    driver: local
  db_data:
    driver: local
  # Volumes de données pour Swarmpit (CouchDB + InfluxDB)
  swarmpit_db_data:
    driver: local
  swarmpit_influx_data:
    driver: local
  # Volume local pour l'historique de messages du chat (sur .135)
  chat_data:
    driver: local

services:
  # Service 1 : MariaDB (Base de données)
  mariadb:
    image: mariadb:lts
    environment:
      # Injection des mots de passe à partir des secrets Swarm
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
    secrets:
      - db_password
      - db_root_password
    volumes:
      # Persistance du répertoire des données de la base de données
      - db_data:/var/lib/mysql
    networks:
      # Connecté uniquement au réseau backend (isolé d'Internet)
      - backend
    deploy:
      # GARDER le placement sur le nœud manager : wp_data/db_data sont des volumes
      # locaux (driver: local) sur .135, tous les réplicas doivent y rester.
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      replicas: 1
      restart_policy:
        condition: on-failure

  # Service 2 : WordPress (fpm-alpine v6.8.2)
  wordpress:
    image: wordpress:6.8.2-fpm-alpine
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_DB_NAME: wordpress_db
    secrets:
      - db_password
    volumes:
      # Volume partagé contenant le code PHP et le dossier des médias wp-content
      - wp_data:/var/www/html
    networks:
      # Connecté au backend (communication MariaDB) et au frontend (communication Nginx)
      - backend
      - frontend
    deploy:
      # GARDER le placement sur le nœud manager : tous les réplicas doivent
      # partager le même volume wp_data local (présent uniquement sur .135).
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      replicas: 2
      restart_policy:
        condition: on-failure

  # Service 3 : Reverse Proxy Nginx (v1.28.0 avec alpine v3.21)
  nginx:
    image: nginx:1.28.0-alpine3.21
    ports:
      # Exposition du port HTTP (80) sur l'ensemble du maillage Swarm (routing mesh)
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      # Accès partagé aux fichiers statiques (images, CSS, JS) de WordPress
      - wp_data:/var/www/html
    networks:
      # Connecté uniquement au réseau frontend
      - frontend
    deploy:
      # GARDER le placement sur le nœud manager : nginx doit lire le volume
      # wp_data local (présent uniquement sur .135), sinon 403.
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      replicas: 2
      restart_policy:
        condition: on-failure

  # Service 4 : Swarmpit Agent (un par nœud, mode global)
  # Collecte les infos Docker de chaque nœud et les remonte à l'app Swarmpit
  swarmpit-agent:
    image: swarmpit/agent:latest
    environment:
      DOCKER_API_VERSION: "1.35"
      EVENT_ENDPOINT: http://swarmpit-app:8080/events
      HEALTH_CHECK_ENDPOINT: http://swarmpit-app:8080/version
    volumes:
      # Nécessaire pour que l'agent parle au démon Docker de SON nœud
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - swarmpit_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.platform.os == linux

  # Service 5a : Swarmpit CouchDB (stockage de la config/état Swarmpit)
  swarmpit-db:
    image: couchdb:2.3.1
    volumes:
      - swarmpit_db_data:/opt/couchdb/data
    networks:
      - swarmpit_net
    deploy:
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      restart_policy:
        condition: on-failure

  # Service 5b : Swarmpit InfluxDB (stockage des métriques)
  swarmpit-influxdb:
    image: influxdb:1.8
    volumes:
      - swarmpit_influx_data:/var/lib/influxdb
    networks:
      - swarmpit_net
    deploy:
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      restart_policy:
        condition: on-failure

  # Service 5c : Swarmpit App (UI d'administration, remplace Portainer)
  swarmpit-app:
    image: swarmpit/swarmpit:latest
    environment:
      SWARMPIT_DB: http://swarmpit-db:5984
      SWARMPIT_INFLUXDB: http://swarmpit-influxdb:8086
    ports:
      # Interface web demandée sur le port 666 (conservé depuis Portainer)
      - "666:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - swarmpit_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      restart_policy:
        condition: on-failure

  # Service 6 : Chat (clone de Discord) exposé sur le port 555
  # NOTE : docker stack deploy ignore la directive build — construire l'image
  # d'abord :  docker compose build chat
  chat:
    image: cord-chat:1.0.0
    build:
      context: ./discord-clone
    ports:
      # Exposition du chat sur le port 555 (routing mesh swarm)
      - "555:555"
    volumes:
      # Persistance de l'historique de messages (volume local sur .135)
      - chat_data:/app/data
    # Permet à l'utilisateur non-root "node" de binder le port privilégié 555
    cap_add:
      - NET_BIND_SERVICE
    networks:
      # Connecté au réseau frontend (comme Nginx)
      - frontend
    deploy:
      # GARDER le placement sur le nœud manager : chat_data est un volume
      # local (driver: local) présent uniquement sur .135.
      placement:
        constraints:
          - node.id == m0lv4bzwgvei55titkfxjx3fl
      replicas: 1
      restart_policy:
        condition: on-failure

configs:
  nginx_config:
    file: ./nginx/default.conf
